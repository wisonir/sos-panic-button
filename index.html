<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS EMERGENCY | Mode Akses Publik</title>
  
  <!-- Google Font & Favicon -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body { 
      background: radial-gradient(circle at 50% 35%, #2a0b10 0%, #131b2e 55%, #0b111e 100%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Container Layar Splash */
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
    }

    /* Logo Badge SOS Emergency Container */
    .brand-icon-wrapper {
      position: relative;
      width: 92px;
      height: 92px;
      background: linear-gradient(145deg, #ef4444 0%, #b91c1c 100%);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.45),
                  0 0 45px rgba(220, 38, 38, 0.35);
      margin-bottom: 1.5rem;
      animation: alertPulse 2s ease-in-out infinite;
    }

    .brand-icon-wrapper svg {
      width: 50px;
      height: 50px;
      fill: #ffffff;
      stroke: none;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
    }

    /* Teks Judul & Subtitle */
    .splash-title {
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      line-height: 1.2;
    }

    .splash-title span {
      color: #ef4444;
    }

    .splash-sub {
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      margin-top: 0.4rem;
    }

    /* Progress Loader Modern */
    .loader-container {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3.5px solid rgba(239, 68, 68, 0.2);
      border-top-color: #ef4444;
      border-right-color: #dc2626;
      border-radius: 50%;
      animation: spin 0.85s cubic-bezier(0.55, 0.25, 0.25, 0.7) infinite;
    }

    .loading-status {
      font-size: 0.8rem;
      color: #fca5a5;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Animasi */
    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }

    @keyframes alertPulse { 
      0%, 100% { 
        transform: scale(1);
        box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4), 0 0 35px rgba(220, 38, 38, 0.25);
      } 
      50% { 
        transform: scale(1.05);
        box-shadow: 0 15px 40px rgba(239, 68, 68, 0.6), 0 0 55px rgba(239, 68, 68, 0.45);
      } 
    }

    /* Tampilan Iframe */
    iframe {
      display: none;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Layar Splash Screen -->
  <div class="splash" id="splash">
    <!-- Ikon SOS Emergency Logo -->
    <div class="brand-icon-wrapper">
      <svg viewBox="0 0 24 24">
        <!-- Segitiga Peringatan Rounded -->
        <path d="M12 2.5a2.5 2.5 0 0 1 2.165 1.25l7.794 13.5A2.5 2.5 0 0 1 19.794 21H4.206a2.5 2.5 0 0 1-2.165-3.75l7.794-13.5A2.5 2.5 0 0 1 12 2.5z" />
        <!-- Tanda Seru Dalam -->
        <path d="M12 8.5v5" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="12" cy="16.8" r="1.3" fill="#b91c1c"/>
      </svg>
    </div>

    <!-- Teks Branding -->
    <h1 class="splash-title">SOS <span>EMERGENCY</span></h1>
    <p class="splash-sub">Mode Akses Publik</p>

    <!-- Loading Indicator -->
    <div class="loader-container">
      <div class="spinner"></div>
      <span class="loading-status">Memuat Portal...</span>
    </div>
  </div>

  <!-- Google Apps Script / App Iframe -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyCfrGAcYTj1Ut4dG_pXZZZApjTKktObJAjZKuSY1-81lsdnA5nu-pCJJg7Gj2oD9QzXQ/exec"
    allowfullscreen
    onload="frameLoaded()">
  </iframe>

  <script>
    function frameLoaded() {
      const splash = document.getElementById("splash");
      const appFrame = document.getElementById("appFrame");
      
      // Animasi Fade Out Halus
      splash.style.opacity = "0";
      setTimeout(() => {
        splash.style.display = "none";
        appFrame.style.display = "block";
      }, 600);
    }
  </script>

</body>
</html>
